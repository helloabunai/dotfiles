################################################################
## MangoHud config used ONLY by ~/scripts/waylandgame.sh
##
## Deliberately separate from MangoHud.conf (which Goverlay owns and
## rewrites) so in-game HUD tweaks here can't be clobbered, and vice versa.
## Pointed at via MANGOHUD_CONFIGFILE in the launcher.
################################################################

## FPS number and nothing else. Not to be combined with other display params.
fps_only

## 141 matches the 144Hz panel; also kills 1000+ fps menu spikes.
fps_limit=141
fps_limit_method=late

position=top-left

## Styling mirrors the global MangoHud.conf so it looks the same as before.
legacy_layout=false
font_size=10
text_color=FFFFFF
background_alpha=0.6
background_color=000000
round_corners=0

## Green above 60, yellow 30-60, red below 30.
fps_color_change
fps_color=B22222,FDFD09,39F900
fps_value=30,60

## Shift_R+F12 hides/shows the counter mid-game.
toggle_hud=Shift_R+F12
